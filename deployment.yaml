apiVersion: apps/v1
kind: Deployment
metadata:
  name: pictures
spec:
  replicas: 1
  selector:
    matchLabels: {app: pictures}
  template:
    metadata:
      labels: {app: pictures}
    spec:
      containers:
      - name: pictures
        image: REPLACE_WITH_REGISTRY/pictures:v1
        ports: [{containerPort: 8080}]
        readinessProbe:
          httpGet: {path: /health, port: 8080}
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pictures
spec:
  selector: {app: pictures}
  ports: [{port: 8080, targetPort: 8080}]
